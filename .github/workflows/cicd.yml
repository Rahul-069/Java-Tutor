name: CI/CD Pipeline for Java Tutor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: java-tutor
  CONTAINER_NAME: java-tutor-app

jobs:
  # Job 1: Run Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: Run linting
        run: |
          # Check for syntax errors and undefined names
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Check for code style (warnings only)
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
        continue-on-error: true
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella

  # Job 2: Build Docker Image
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} .
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
      
      - name: Test Docker image
        run: |
          # Run container in detached mode
          docker run -d --name test-container -p 8080:8080 ${{ env.DOCKER_IMAGE }}:latest
          
          # Wait for container to start
          sleep 10
          
          # Check if container is running
          docker ps | grep test-container
          
          # Test health endpoint
          curl -f http://localhost:8080/health || exit 1
          
          # Clean up
          docker stop test-container
          docker rm test-container
      
      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE }}:latest | gzip > java-tutor-image.tar.gz
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: java-tutor-image.tar.gz
          retention-days: 1

  # Job 3: Deploy to AWS EC2
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image
      
      - name: Configure AWS credentials (optional)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
        continue-on-error: true
      
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Save SSH key
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          # Copy Docker image to EC2
          scp -o StrictHostKeyChecking=no -i ec2_key.pem \
            java-tutor-image.tar.gz ${EC2_USER}@${EC2_HOST}:/tmp/
          
          # SSH into EC2 and deploy
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            # Load Docker image
            docker load < /tmp/java-tutor-image.tar.gz
            
            # Stop and remove old container
            docker stop java-tutor-app || true
            docker rm java-tutor-app || true
            
            # Run new container
            docker run -d -p 8080:8080 \
              --name java-tutor-app \
              --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp:/tmp \
              java-tutor:latest
            
            # Clean up
            rm /tmp/java-tutor-image.tar.gz
            
            # Remove old images
            docker image prune -f
            
            # Check if container is running
            sleep 5
            docker ps | grep java-tutor-app
            
            echo "✅ Deployment successful!"
          EOF
          
          # Clean up local key
          rm ec2_key.pem
      
      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # Wait for app to fully start
          sleep 10
          
          # Check health endpoint
          curl -f http://${EC2_HOST}/health || exit 1
          
          echo "✅ Health check passed!"
      
      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "🎉 Deployment to EC2 successful!"
          else
            echo "❌ Deployment failed!"
          fi

  # Job 4: Rollback on failure
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
      - name: Rollback deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} << 'EOF'
            # Stop failed container
            docker stop java-tutor-app || true
            docker rm java-tutor-app || true
            
            # Start previous version (if exists)
            docker run -d -p 8080:8080 \
              --name java-tutor-app \
              --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp:/tmp \
              java-tutor:previous || echo "No previous version to rollback to"
          EOF
          
          rm ec2_key.pem
          echo "⚠️ Rollback attempted"
