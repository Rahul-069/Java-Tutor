name: CI/CD Pipeline for Java Tutor

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: java-tutor-app
  CONTAINER_NAME: java-tutor-app

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: Run linting
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/ -v --cov=. --cov-report=term || true
        continue-on-error: true

  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          if ! grep -q "BEGIN" ec2_key.pem; then
            echo "Error: SSH key is empty or invalid"
            exit 1
          fi
          
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 -i ec2_key.pem ${EC2_USER}@${EC2_HOST} "echo 'SSH connection successful'"
          
          echo "Syncing files to EC2..."
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ec2_key.pem" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache/' \
            --exclude='venv/' \
            --exclude='*.db' \
            --exclude='*.log' \
            ./ ${EC2_USER}@${EC2_HOST}:~/java-tutor-deploy/
          
          echo "Deploying application..."
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} bash << 'EOF'
            cd ~/java-tutor-deploy
            
            echo "Building Docker image..."
            docker build -t java-tutor-app:latest .
            
            docker tag java-tutor-app:latest java-tutor-app:previous 2>/dev/null || true
            
            echo "Stopping old container..."
            docker stop java-tutor-app 2>/dev/null || true
            docker rm java-tutor-app 2>/dev/null || true
            
            echo "Starting new container..."
            docker run -d -p 8080:8080 \
              --name java-tutor-app \
              --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /tmp:/tmp \
              java-tutor-app:latest
            
            echo "Waiting for container to start..."
            sleep 15
            
            if docker ps | grep -q java-tutor-app; then
              echo "Container started successfully"
              docker ps | grep java-tutor-app
            else
              echo "Container failed to start"
              docker logs java-tutor-app
              exit 1
            fi
            
            echo "Cleaning up old images..."
            docker image prune -f
            
            echo "Deployment complete"
          EOF
          
          rm -f ec2_key.pem
      
      - name: Health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for application to be ready..."
          sleep 10
          
          max_attempts=5
          attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."
            
            response=$(curl -s -o /dev/null -w "%{http_code}" http://${EC2_HOST}/health || echo "000")
            
            if [ "$response" == "200" ]; then
              echo "Health check passed"
              exit 0
            else
              echo "Health check returned status: $response"
              if [ $attempt -lt $max_attempts ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "Health check failed after $max_attempts attempts"
          exit 1
      
      - name: Deployment summary
        if: success()
        run: |
          echo "Deployment Successful"
          echo "Application URL: http://${{ secrets.EC2_HOST }}"
          echo "Health Check: http://${{ secrets.EC2_HOST }}/health"

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    
    steps:
      - name: Rollback deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "Deployment failed - attempting rollback..."
          
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${EC2_USER}@${EC2_HOST} bash << 'EOF'
            echo "Rolling back to previous version..."
            
            docker stop java-tutor-app 2>/dev/null || true
            docker rm java-tutor-app 2>/dev/null || true
            
            if docker images | grep -q "java-tutor-app.*previous"; then
              echo "Previous version found, starting..."
              
              docker run -d -p 8080:8080 \
                --name java-tutor-app \
                --restart unless-stopped \
                -v /var/run/docker.sock:/var/run/docker.sock \
                -v /tmp:/tmp \
                java-tutor-app:previous
              
              sleep 10
              
              if docker ps | grep -q java-tutor-app; then
                echo "Rollback successful"
              else
                echo "Rollback failed"
              fi
            else
              echo "No previous version available"
            fi
          EOF
          
          rm -f ec2_key.pem